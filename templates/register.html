{% extends "base.html" %}

{% block title %}Sign Up - HabitFlow{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4 rounded-4 auth-card">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary-subtle text-primary mb-3">
                        <i class="fas fa-user-plus fa-2x"></i>
                    </div>
                    <h2 class="fw-bold">Create Account</h2>
                    <p class="text-muted small">Begin building life-changing habits with smart behavioral guidance</p>
                </div>

                <div id="registerAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm" onsubmit="event.preventDefault(); handleRegister();">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="Alex Morgan" required autocomplete="name" minlength="2">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="alex@example.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" required minlength="8" autocomplete="new-password">
                        </div>
                    </div>

                    <button type="submit" id="registerSubmitBtn" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm">
                        <span id="registerBtnText">Create My Account</span>
                        <span id="registerSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center text-muted small mb-0">
                    Already have an account?
                    <a href="/login" class="fw-bold text-primary text-decoration-none">Sign in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function handleRegister() {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        const alertEl = document.getElementById('registerAlert');
        const submitBtn = document.getElementById('registerSubmitBtn');
        const btnText = document.getElementById('registerBtnText');
        const spinner = document.getElementById('registerSpinner');

        alertEl.classList.add('d-none');

        if (password !== confirmPassword) {
            alertEl.textContent = 'Passwords do not match. Please verify.';
            alertEl.classList.remove('d-none');
            return;
        }

        btnText.textContent = 'Creating Account...';
        spinner.classList.remove('d-none');
        submitBtn.disabled = true;

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                // If auto-logged in with token
                if (data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    updateNavbarState();
                    window.location.href = '/dashboard';
                } else {
                    window.location.href = '/login';
                }
            } else {
                alertEl.textContent = data.message || 'Registration failed. Please try again.';
                alertEl.classList.remove('d-none');
            }
        } catch (err) {
            alertEl.textContent = 'Connection error. Please verify the server is running.';
            alertEl.classList.remove('d-none');
        } finally {
            btnText.textContent = 'Create My Account';
            spinner.classList.add('d-none');
            submitBtn.disabled = false;
        }
    }
</script>
{% endblock %}
